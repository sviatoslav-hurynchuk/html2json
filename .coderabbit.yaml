# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: 2
language: "en-US"
tone_instructions: "Be thorough, critical, and focus on code robustness, edge cases, and clean code principles."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"

  path_instructions:
    - path: "html2json.js"
      instructions: |
        Review this pure JavaScript HTML-to-JSON AST parser strictly against these criteria:
        1. NO DOMParser or browser DOM APIs allowed (must be 100% pure JS).
        2. NO-CRASH GUARANTEE: Ensure there are no unhandled exceptions on malformed HTML, invalid inputs, unclosed tags, or extreme nesting.
        3. Clean Code: Ensure comments explain "WHY" rather than "WHAT". Code should be self-documenting.
        4. Performance & Security: Check for potential ReDoS (Regular Expression Denial of Service) in tokenizing regexes and avoid stack overflow on deep inputs.
    - path: "test_html2json.js"
      instructions: |
        Verify test coverage comprehensiveness across edge cases, void tags, comments, doctype, and malformed HTML.

chat:
  auto_reply: true
