<!-- Table with complex structure -->
<table border="1" cellpadding="5" cellspacing="0">
    <caption>Monthly Sales Report</caption>
    <colgroup>
        <col span="1" style="background-color: #f0f0f0">
        <col span="2">
    </colgroup>
    <thead>
        <tr>
            <th rowspan="2">Product</th>
            <th colspan="2">Sales</th>
        </tr>
        <tr>
            <th>Q1</th>
            <th>Q2</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Widget A</td>
            <td>$1,200</td>
            <td>$1,500</td>
        </tr>
        <tr>
            <td>Widget B</td>
            <td>$800</td>
            <td>$950</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td>Total</td>
            <td>$2,000</td>
            <td>$2,450</td>
        </tr>
    </tfoot>
</table>

<!-- Definition list -->
<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>
    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
    <dt>JS</dt>
    <dd>JavaScript</dd>
</dl>

<!-- Nested lists -->
<ul>
    <li>Item 1
        <ul>
            <li>Sub-item 1.1</li>
            <li>Sub-item 1.2
                <ol>
                    <li>Deep item 1.2.1</li>
                    <li>Deep item 1.2.2</li>
                </ol>
            </li>
        </ul>
    </li>
    <li>Item 2</li>
</ul>
