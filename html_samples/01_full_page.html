<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete HTML5 Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: Arial, sans-serif; }
        .highlight { color: red; }
    </style>
</head>
<body>
    <!-- Main navigation -->
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <h1>Welcome to My Website</h1>
            <p>This is a <strong>paragraph</strong> with <em>inline</em> elements.</p>
            <img src="photo.jpg" alt="A beautiful photo" width="640" height="480">
            <br>
            <hr>
        </article>

        <section id="form-section">
            <h2>Contact Form</h2>
            <form action="/submit" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">
                <textarea name="message" rows="5" cols="40">Default message text</textarea>
                <button type="submit" disabled>Send</button>
            </form>
        </section>

        <section id="media">
            <video controls width="320">
                <source src="movie.mp4" type="video/mp4">
                <track src="captions.vtt" kind="subtitles" srclang="en" label="English">
                Your browser does not support the video tag.
            </video>
            <audio controls>
                <source src="audio.ogg" type="audio/ogg">
            </audio>
        </section>

        <aside>
            <h3>Related Links</h3>
            <ul>
                <li><a href="https://example.com/page?q=search&lang=en#section">External Link</a></li>
            </ul>
        </aside>
    </main>

    <footer>
        <p>&copy; 2024 My Website. All rights reserved.</p>
    </footer>

    <script>
        console.log("Hello <world>");
        var x = "</script" + ">";
    </script>
</body>
</html>
